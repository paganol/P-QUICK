[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pquick"
version = "0.1.0"
description = "Planck Quick Integrated Convolution Kit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "astropy>=5.0",
  "healpy>=1.16",
  "PyYAML>=6.0",
  "ducc0>=0.41.0",
  "mpi4py>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
performance = [
  "numba>=0.59",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pquick-run = "pquick.pipeline:main"
