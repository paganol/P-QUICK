inputs:
  sky_alm: inputs/sky/example_sky_alms.npz
  beams_dir: inputs/beams
  mission_length: full
  pointings: inputs/pointings/pointing_
  flags: inputs/flags/flags_
  # Planck data release to emulate: NPIPE (default; PR4 is an alias) or PR3.
  # Selects the focal-plane geometry, polarisation efficiency and detector map
  # weights together (beams are common to both releases).
  data_version: NPIPE

detector_selection:
  channel: null
  detectors: []

resampling:
  coordinate_system: galactic
  center_pointing: false

nthreads: 0

convolution:
  lmax: 1024
  mmax: 16
  epsilon: 1.0e-5
  chunks: 1
  cache_interpolator: true
  beam_normalization: unit_integral

map:
  nside: 512
  nest: false
  # use_cross_pol: true weights the map-making polarisation response by the
  # per-detector rho = (1-eps)/(1+eps) from the RIMO (= qp_planck rhohit: IMO).
  # false = ideal detectors, rho = 1 (= qp_planck rhohit: Ideal). T is unaffected.
  use_cross_pol: true

output:
  output_dir: outputs
  output_prefix: pquick_demo
  # Also write the _hits, _wpol and _nobs00 diagnostic maps (default: only _iqu).
  extended_outputs: false
