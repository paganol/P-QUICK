inputs:
  sky_alm: inputs/sky/alms_cmb0000.fits
  beams_dir: inputs/beams
  rimo_file: inputs/RIMOs/RIMO_HFI_npipe5v16_symmetrized.fits
  pointing:
    input_root: inputs/pointings/processed_od_
    mission_length: 91-99

detector_selection:
  channel: 100ghz
  detectors: null

resampling:
  coordinate_system: galactic

convolution:
  lmax: 1024
  mmax: 6
  nthreads: 0
  epsilon: 1.0e-5
  chunks: 1

map:
  nside: 512
  nest: false
  output_prefix: od91_99_100ghz_nside1024

output:
  output_dir: outputs

verbose: true
